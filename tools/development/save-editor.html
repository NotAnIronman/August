<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>August Save Editor</title>
<style>
  :root{
    --bg: #17150f;
    --panel: #211d15;
    --panel-2: #2a251b;
    --line: #3a3325;
    --gold: #c9a227;
    --gold-dim: #8f7420;
    --ink: #e9e1cd;
    --ink-dim: #a89c80;
    --danger: #a4433a;
    --danger-bright: #d4574a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, "IBM Plex Mono", monospace; }

  #app { display:flex; flex-direction:column; height:100%; }

  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: normal;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  header h1 span { color: var(--gold); }
  .file-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  button, .filebtn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 3px;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:hover, .filebtn:hover { border-color: var(--gold-dim); }
  button.primary {
    background: var(--gold);
    color: #201a08;
    border-color: var(--gold);
    font-weight: 600;
  }
  button.primary:hover { background: #ddb42f; }
  button.danger { color: var(--danger-bright); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  input[type=file] { display:none; }

  #status { font-size: 12px; color: var(--ink-dim); font-family: ui-monospace, monospace; }

  main { flex:1; display:flex; overflow:hidden; }

  #empty {
    margin: auto;
    text-align:center;
    color: var(--ink-dim);
    max-width: 420px;
    line-height: 1.6;
  }
  #empty .filebtn { display:inline-block; margin-top: 14px; }

  #sidebar {
    width: 220px;
    border-right: 1px solid var(--line);
    padding: 16px 0;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    padding: 0 20px 10px;
    margin: 0;
    font-family: ui-monospace, monospace;
    font-weight: normal;
  }
  .acct {
    padding: 9px 20px;
    cursor: pointer;
    font-size: 14.5px;
    border-left: 2px solid transparent;
    color: var(--ink-dim);
  }
  .acct:hover { background: var(--panel); color: var(--ink); }
  .acct.active {
    background: var(--panel);
    color: var(--gold);
    border-left-color: var(--gold);
  }
  .acct .dirty-dot {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--gold); margin-right:7px; vertical-align:middle;
    visibility:hidden;
  }
  .acct.dirty .dirty-dot { visibility: visible; }

  #content { flex:1; overflow-y: auto; padding: 24px 32px 60px; }

  .acct-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 18px; }
  .acct-header h2 { margin:0; font-size: 22px; font-weight:normal; }
  .acct-header .meta { font-size: 12px; color: var(--ink-dim); font-family: ui-monospace, monospace; }

  .tabs { display:flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab {
    padding: 8px 16px;
    cursor: pointer;
    color: var(--ink-dim);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  table { width:100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align:left;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    font-weight: normal;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid #241f16;
  }
  tbody tr:hover { background: #1c1810; }
  td input[type=number], td input[type=text] {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink);
    font-family: ui-monospace, monospace;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 2px;
  }
  td input:focus {
    outline:none;
    border-color: var(--gold-dim);
    background: var(--panel-2);
  }
  td input[type=checkbox] { transform: translateY(2px); }
  .row-del {
    background:none; border:none; color: var(--ink-dim);
    cursor:pointer; font-size: 15px; padding: 2px 8px;
  }
  .row-del:hover { color: var(--danger-bright); }

  .item-name {
    color: var(--ink-dim);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
    display: inline-block;
    vertical-align: middle;
  }
  .item-name.unknown { font-style: italic; opacity: 0.5; }
  .qty-cell { display:flex; align-items:center; gap:4px; }
  .qty-cell input { flex: 1; min-width: 60px; }
  .qty-quick {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 10.5px;
    font-family: ui-monospace, monospace;
    padding: 3px 6px;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
  }
  .qty-quick:hover { color: var(--gold); border-color: var(--gold-dim); }
  #nameStatus { font-size: 11px; color: var(--ink-dim); font-family: ui-monospace, monospace; }

  .table-actions { margin-top: 12px; display:flex; gap:10px; align-items:center; }
  .empty-state { color: var(--ink-dim); font-size: 13px; padding: 20px 0; font-family: ui-monospace, monospace; }

  #addPanel {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  #addPanel .add-field { display:flex; flex-direction:column; gap:5px; }
  #addPanel .add-field label {
    font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--ink-dim); font-family: ui-monospace, monospace;
  }
  #addPanel input[type=number] {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: ui-monospace, monospace;
    font-size: 13px;
    padding: 7px 9px;
    border-radius: 3px;
    width: 130px;
  }
  #addPanel input[type=number]:focus { outline:none; border-color: var(--gold-dim); }
  #addPanel .add-name { min-width: 160px; max-width: 260px; }
  #addPanel .add-name .item-name { max-width: none; padding: 7px 0; font-size: 13px; }
  #addPanel .qty-cell input { width: 90px; }

  .kv-grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr));
    gap: 10px 18px;
  }
  .kv-grid .item {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
  }
  .kv-grid .item label {
    display:block; font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--ink-dim); font-family: ui-monospace, monospace; margin-bottom:5px;
  }
  .kv-grid .item input { width:100%; background:transparent; border:none; color:var(--ink); font-family: ui-monospace, monospace; font-size:14px; padding:0;}
  .kv-grid .item input:focus { outline:none; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--gold-dim); color: var(--ink);
    padding: 10px 18px; border-radius: 4px; font-size: 13px; font-family: ui-monospace, monospace;
    opacity: 0; pointer-events:none; transition: opacity 0.25s;
  }
  #toast.show { opacity: 1; }

  ::-webkit-scrollbar { width: 10px; height:10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Save <span>Editor</span></h1>
    <div class="file-row">
      <label class="filebtn" for="filepicker">Open .sqlite file</label>
      <input type="file" id="filepicker" accept=".sqlite,.db,.sqlite3">
      <button id="exportBtn" class="primary" disabled>Export edited .sqlite</button>
      <span id="status">nothing loaded yet — your file never leaves this browser tab</span>
      <span id="nameStatus"></span>
    </div>
  </header>
  <main>
    <div id="empty">
      Open the <span class="mono">game.sqlite</span> file from your computer. Everything is parsed
      and edited locally in this page — nothing is uploaded anywhere.
      <div><label class="filebtn" for="filepicker">Choose file&hellip;</label></div>
    </div>
    <div id="workspace" style="display:none; flex:1; display:flex;">
      <div id="sidebar">
        <h2>Accounts</h2>
        <div id="acctList"></div>
      </div>
      <div id="content"></div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
let SQL = null;
let db = null;
let accounts = {};      // account_name -> parsed state object
let dirty = {};         // account_name -> bool
let currentAccount = null;
let currentTab = 'inventory';
let itemNames = {};     // itemId -> name, loaded from the OSRS Wiki prices API
let itemNamesLoaded = false;

function setNameStatus(msg){ document.getElementById('nameStatus').textContent = msg; }

async function loadItemNames(){
  setNameStatus('fetching item name lookup…');
  try {
    const res = await fetch('https://prices.runescape.wiki/api/v1/osrs/mapping');
    if (!res.ok) throw new Error('bad response ' + res.status);
    const list = await res.json();
    list.forEach(it => { itemNames[it.id] = it.name; });
    itemNamesLoaded = true;
    setNameStatus(`item names loaded (${list.length.toLocaleString()})`);
  } catch (err){
    console.warn('could not load item name mapping', err);
    setNameStatus('item name lookup unavailable — showing IDs only');
  }
  // re-render if a table is currently showing, now that names may have arrived
  if (currentAccount) renderContent();
}

function nameFor(itemId){
  const n = itemNames[itemId];
  return n || null;
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

const ARRAY_FIELDS = {
  inventory: { label: 'Inventory', columns: ['slot','itemId','quantity'] },
  bank: { label: 'Bank', columns: ['slot','itemId','quantity','tab','placeholder','filler'] },
  equipment: { label: 'Equipment', columns: ['slot','itemId','quantity'] },
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

async function ensureSQL(){
  if (SQL) return SQL;
  SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  return SQL;
}

document.getElementById('filepicker').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  setStatus('loading sql engine…');
  try {
    await ensureSQL();
    const buf = await file.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));
    loadAccounts();
    setStatus(`loaded ${file.name} — ${Object.keys(accounts).length} account(s)`);
    document.getElementById('empty').style.display = 'none';
    document.getElementById('workspace').style.display = 'flex';
    document.getElementById('exportBtn').disabled = false;
    renderSidebar();
    const first = Object.keys(accounts)[0];
    if (first) selectAccount(first);
    if (!itemNamesLoaded) loadItemNames();
  } catch (err){
    console.error(err);
    setStatus('failed to load file — see console. Is this a valid sqlite file?');
    toast('Could not read that file as SQLite');
  }
});

function loadAccounts(){
  accounts = {}; dirty = {};
  const res = db.exec("SELECT account_name, state_json FROM player_states");
  if (!res.length) return;
  for (const row of res[0].values){
    const [name, json] = row;
    try {
      accounts[name] = JSON.parse(json);
      dirty[name] = false;
    } catch(e){
      console.warn('could not parse state_json for', name, e);
    }
  }
}

function renderSidebar(){
  const list = document.getElementById('acctList');
  list.innerHTML = '';
  Object.keys(accounts).sort().forEach(name=>{
    const div = document.createElement('div');
    div.className = 'acct' + (name===currentAccount?' active':'') + (dirty[name]?' dirty':'');
    const dot = document.createElement('span');
    dot.className = 'dirty-dot';
    div.append(dot, document.createTextNode(name));
    div.onclick = ()=> selectAccount(name);
    list.appendChild(div);
  });
}

function selectAccount(name){
  currentAccount = name;
  renderSidebar();
  renderContent();
}

function renderContent(){
  const content = document.getElementById('content');
  const data = accounts[currentAccount];
  if (!data){ content.innerHTML = ''; return; }

  const availableTabs = Object.keys(ARRAY_FIELDS).filter(k => Array.isArray(data[k]));
  if (!availableTabs.includes(currentTab)) currentTab = availableTabs[0] || 'inventory';

  let html = `
    <div class="acct-header">
      <h2>${escapeHtml(currentAccount)}</h2>
      <span class="meta">stage: ${escapeHtml(data.accountStage ?? '—')} &nbsp;·&nbsp; playtime: ${escapeHtml(formatPlaytime(data.playTimeSeconds))}</span>
    </div>
    <div class="tabs">
      ${availableTabs.map(k=>`<div class="tab ${k===currentTab?'active':''}" data-tab="${k}">${ARRAY_FIELDS[k].label} (${data[k].length})</div>`).join('')}
      ${data.skills ? `<div class="tab ${currentTab==='skills'?'active':''}" data-tab="skills">Skills</div>` : ''}
    </div>
    <div id="tabBody"></div>
  `;
  content.innerHTML = html;
  content.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ currentTab = t.dataset.tab; renderContent(); };
  });
  if (currentTab === 'skills') {
    renderSkills();
  } else {
    renderArrayTable(currentTab);
  }
}

function formatPlaytime(sec){
  if (sec == null) return '—';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  return `${h}h ${m}m`;
}

let currentAddPanel = { open: false, itemId: '', quantity: 1 };

function renderArrayTable(fieldKey){
  const def = ARRAY_FIELDS[fieldKey];
  const arr = accounts[currentAccount][fieldKey] || [];
  const body = document.getElementById('tabBody');

  const addPanelHtml = `
    <div id="addPanel" style="display:${currentAddPanel.open ? 'flex':'none'};">
      <div class="add-field">
        <label>Item ID</label>
        <input type="number" id="addItemId" value="${escapeHtml(currentAddPanel.itemId)}" placeholder="e.g. 4151">
      </div>
      <div class="add-field add-name">
        <label>&nbsp;</label>
        <span id="addItemName" class="item-name ${nameFor(Number(currentAddPanel.itemId)) ? '' : 'unknown'}">
          ${currentAddPanel.itemId !== '' ? escapeHtml(nameFor(Number(currentAddPanel.itemId)) ?? (itemNamesLoaded ? 'unknown item' : 'loading…')) : 'type an item id'}
        </span>
      </div>
      <div class="add-field">
        <label>Quantity</label>
        <div class="qty-cell">
          <input type="number" id="addQty" value="${escapeHtml(currentAddPanel.quantity)}" min="1">
          <button type="button" class="qty-quick" data-qty="1">1</button>
          <button type="button" class="qty-quick" data-qty="999000000">999M</button>
        </div>
      </div>
      <button id="confirmAddBtn" class="primary">Add</button>
      <button id="cancelAddBtn">Cancel</button>
    </div>`;

  if (!arr.length){
    body.innerHTML = `<div class="empty-state">No items.</div>
      <div class="table-actions"><button id="addRowBtn">+ Add item</button></div>
      ${addPanelHtml}`;
    wireAddPanel(fieldKey);
    document.getElementById('addRowBtn').onclick = ()=> toggleAddPanel(fieldKey);
    return;
  }

  let html = `<table><thead><tr>`;
  def.columns.forEach(c => {
    html += `<th>${c}</th>`;
    if (c === 'itemId') html += `<th>name</th>`;
  });
  html += `<th></th></tr></thead><tbody>`;
  arr.forEach((item, idx)=>{
    html += `<tr data-idx="${idx}">`;
    def.columns.forEach(c=>{
      const val = item[c];
      if (c === 'quantity'){
        html += `<td><div class="qty-cell">
            <input type="number" data-field="${c}" value="${escapeHtml(val ?? '')}">
            <button type="button" class="qty-quick" data-qty="1">1</button>
            <button type="button" class="qty-quick" data-qty="999000000">999M</button>
          </div></td>`;
      } else if (typeof val === 'boolean'){
        html += `<td><input type="checkbox" data-field="${c}" ${val?'checked':''}></td>`;
      } else {
        html += `<td><input type="${typeof val === 'number' ? 'number':'text'}" data-field="${c}" value="${escapeHtml(val ?? '')}"></td>`;
      }
      if (c === 'itemId'){
        const nm = nameFor(item.itemId);
        html += `<td><span class="item-name ${nm?'':'unknown'}" title="${escapeHtml(nm ?? '')}">${escapeHtml(nm ?? (itemNamesLoaded ? 'unknown item' : 'loading…'))}</span></td>`;
      }
    });
    html += `<td><button class="row-del" title="Remove row">&times;</button></td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>
    <div class="table-actions">
      <button id="addRowBtn">+ Add item</button>
      <span style="color:var(--ink-dim); font-size:12px;" class="mono">edits are kept in memory — use "Export edited .sqlite" above when done</span>
    </div>
    ${addPanelHtml}`;
  body.innerHTML = html;
  document.getElementById('addRowBtn').onclick = ()=> toggleAddPanel(fieldKey);
  wireAddPanel(fieldKey);

  body.querySelectorAll('tbody tr').forEach(tr=>{
    const idx = parseInt(tr.dataset.idx);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const field = inp.dataset.field;
        let v;
        if (inp.type === 'checkbox') v = inp.checked;
        else if (inp.type === 'number') v = inp.value === '' ? 0 : Number(inp.value);
        else v = inp.value;
        arr[idx][field] = v;
        markDirty();
        if (field === 'itemId'){
          const nameSpan = tr.querySelector('.item-name');
          if (nameSpan){
            const nm = nameFor(v);
            nameSpan.textContent = nm ?? (itemNamesLoaded ? 'unknown item' : 'loading…');
            nameSpan.title = nm ?? '';
            nameSpan.classList.toggle('unknown', !nm);
          }
        }
      });
    });
    tr.querySelectorAll('.qty-quick').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const qty = Number(btn.dataset.qty);
        arr[idx].quantity = qty;
        const qtyInput = tr.querySelector('input[data-field="quantity"]');
        if (qtyInput) qtyInput.value = qty;
        markDirty();
      });
    });
    tr.querySelector('.row-del').addEventListener('click', ()=>{
      arr.splice(idx,1);
      markDirty();
      renderArrayTable(fieldKey);
    });
  });
}

function toggleAddPanel(fieldKey){
  currentAddPanel.open = !currentAddPanel.open;
  renderArrayTable(fieldKey);
  if (currentAddPanel.open){
    const el = document.getElementById('addItemId');
    if (el) el.focus();
  }
}

function wireAddPanel(fieldKey){
  const idInput = document.getElementById('addItemId');
  const qtyInput = document.getElementById('addQty');
  const nameSpan = document.getElementById('addItemName');
  const confirmBtn = document.getElementById('confirmAddBtn');
  const cancelBtn = document.getElementById('cancelAddBtn');
  if (!idInput) return; // panel not rendered (shouldn't happen, but be safe)

  idInput.addEventListener('input', ()=>{
    currentAddPanel.itemId = idInput.value;
    const id = Number(idInput.value);
    if (idInput.value === '' || isNaN(id)){
      nameSpan.textContent = 'type an item id';
      nameSpan.classList.add('unknown');
      return;
    }
    const nm = nameFor(id);
    nameSpan.textContent = nm ?? (itemNamesLoaded ? 'unknown item' : 'loading…');
    nameSpan.classList.toggle('unknown', !nm);
  });

  qtyInput.addEventListener('input', ()=>{
    currentAddPanel.quantity = qtyInput.value;
  });

  document.querySelectorAll('#addPanel .qty-quick').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      qtyInput.value = btn.dataset.qty;
      currentAddPanel.quantity = btn.dataset.qty;
    });
  });

  confirmBtn.addEventListener('click', ()=>{
    const id = Number(idInput.value);
    const qty = Number(qtyInput.value);
    if (idInput.value === '' || isNaN(id)){
      idInput.focus();
      toast('Enter an item ID first');
      return;
    }
    if (!qtyInput.value || isNaN(qty) || qty < 1){
      qtyInput.focus();
      toast('Enter a quantity of 1 or more');
      return;
    }
    addItem(fieldKey, id, qty);
    // reset for the next add, keep panel open so multiple items can be added quickly
    currentAddPanel.itemId = '';
    currentAddPanel.quantity = 1;
    renderArrayTable(fieldKey);
    const el = document.getElementById('addItemId');
    if (el) el.focus();
  });

  cancelBtn.addEventListener('click', ()=>{
    currentAddPanel.open = false;
    currentAddPanel.itemId = '';
    currentAddPanel.quantity = 1;
    renderArrayTable(fieldKey);
  });
}

function addItem(fieldKey, itemId, quantity){
  const arr = accounts[currentAccount][fieldKey];
  const def = ARRAY_FIELDS[fieldKey];
  const nextSlot = arr.length ? Math.max(...arr.map(i=>i.slot ?? -1)) + 1 : 0;
  const row = {};
  def.columns.forEach(c=>{
    if (c === 'slot') row[c] = nextSlot;
    else if (c === 'itemId') row[c] = itemId;
    else if (c === 'quantity') row[c] = quantity;
    else if (c === 'tab') row[c] = 0;
    else row[c] = false;
  });
  arr.push(row);
  markDirty();
  toast(`Added ${nameFor(itemId) ?? ('item ' + itemId)} ×${quantity.toLocaleString()}`);
}

function renderSkills(){
  const skills = accounts[currentAccount].skills;
  const body = document.getElementById('tabBody');
  if (!skills){ body.innerHTML = `<div class="empty-state">No skills data.</div>`; return; }
  let entries = Array.isArray(skills) ? skills.map((v,i)=>[String(i), v]) : Object.entries(skills);
  let html = `<div class="kv-grid">`;
  entries.forEach(([key,val])=>{
    if (val !== null && typeof val === 'object'){
      Object.entries(val).forEach(([subk,subv])=>{
        html += `<div class="item"><label>${escapeHtml(key)} · ${escapeHtml(subk)}</label><input data-skill="${escapeHtml(key)}" data-sub="${escapeHtml(subk)}" type="${typeof subv==='number'?'number':'text'}" value="${escapeHtml(subv)}"></div>`;
      });
    } else {
      html += `<div class="item"><label>${escapeHtml(key)}</label><input data-skill="${escapeHtml(key)}" type="${typeof val==='number'?'number':'text'}" value="${escapeHtml(val)}"></div>`;
    }
  });
  html += `</div>`;
  body.innerHTML = html;
  body.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const k = inp.dataset.skill, sub = inp.dataset.sub;
      const v = inp.type === 'number' ? Number(inp.value) : inp.value;
      if (sub !== undefined) skills[k][sub] = v; else skills[k] = v;
      markDirty();
    });
  });
}

function markDirty(){
  dirty[currentAccount] = true;
  renderSidebar();
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if (!db) return;
  // write back every account's (possibly edited) JSON into the db
  Object.keys(accounts).forEach(name=>{
    const json = JSON.stringify(accounts[name]);
    const stmt = db.prepare("UPDATE player_states SET state_json = ? WHERE account_name = ?");
    stmt.run([json, name]);
    stmt.free();
  });
  const binary = db.export();
  const blob = new Blob([binary], { type: 'application/x-sqlite3' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'game-edited.sqlite';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  Object.keys(dirty).forEach(k=>dirty[k]=false);
  renderSidebar();
  toast('Exported game-edited.sqlite');
});
</script>
</body>
</html>
